# ============================================================================
# Standalone Verifier & Runtime Validation Configuration
# ----------------------------------------------------------------------------
# Consumed by standalone verification tools in ../tools/java-build-tool.sh
# (AndroidPublicationVerifier, PublicationPinsVerifier, NativeTestRunner,
# NativeArchiveVerifier, JniArtifactVerifier, SwiftProblemScanner, etc.).
# Kept separate from gradle.properties so product builds do not re-configure
# or invalidate caches when verification contracts or VM selectors change.
# ============================================================================

# ----------------------------------------------------------------------------
# Android & Maven Publication Acceptance
# (AndroidPublicationVerifier, PublicationPinsVerifier)
# ----------------------------------------------------------------------------
# Comma-separated JVM internal .class paths required in the published AAR
# classes.jar (for example: io/github/kotlinmania/template/Template.class).
project.publication.android.publicClasses=

# Comma-separated public signature edges in group:root-module:Android-POM-module
# format; no automatic -android suffix is assumed.
project.publication.android.apiDependencies=

# Optional comma-separated group:root-module:Android-POM-module mappings for
# PublicationPinsVerifier when Android POM artifact IDs differ from root modules.
project.publication.android.pomDependencyModules=

# true only for API-facade modules that intentionally publish no direct bytecode.
project.publication.android.apiFacade=false

# Cross-host root staging inputs when assembling androidPublicationBundle on Linux
# from a same-HEAD macOS root staging artifact.
project.publication.android.rootStagingDirectory=
project.publication.android.expectedRootHead=

# ----------------------------------------------------------------------------
# Foreign Native Runtime Validation (NativeTestRunner)
# ----------------------------------------------------------------------------
# Optional Parallels Tools guest name or UUID for running linked foreign test
# binaries (linuxArm64 / linuxX64 -> test.kexe, mingwX64 -> test.exe).
# Empty selects the single running guest for that OS family.
project.validation.linux.vm=
project.validation.windows.vm=

# ----------------------------------------------------------------------------
# Native Archive & JNI Artifact Verification
# (NativeArchiveVerifier, JniArtifactVerifier)
# ----------------------------------------------------------------------------
# Optional comma-separated Konan target names for static archive verification
# (for example: linux_arm64,linux_x64).
project.validation.native.archiveTargets=

# Optional JNI verification profile name for JniArtifactVerifier.
project.validation.jni.profile=

# ----------------------------------------------------------------------------
# Swift Export & Consumer Verification (SwiftProblemScanner, SwiftTestVerifier)
# ----------------------------------------------------------------------------
# true requires a fresh generation receipt, strict frontend command logs, and
# passing test XML with zero failures, errors, or skips.
project.validation.swift.requireAcceptance=false

# Comma-separated Suite.testName identifiers required by Swift acceptance checks.
project.validation.swift.requiredTests=
