# ============================================================================
# Native C bindings (FFI/ABI/N-API/JNI) — opt-in per project.
# ----------------------------------------------------------------------------
# Each gate is independent. Default off; a repo that ports a C-FFI-heavy crate
# (libc, ssl, sqlite) flips the channels it needs to true and fills in the
# corresponding stub files:
#
#   project.ffi.native=true  → Kotlin/Native cinterop + per-target static
#                              wrapper library. Files under
#                              src/native/interop/cinterop/<name>.def and
#                              <name>_wrapper.{h,c}. Requires
#                              kotlin.mpp.enableCInteropCommonization=true
#                              (set automatically when this gate is on).
#   project.ffi.jvm=true     → JNI shared library for the JVM target, built
#                              with host clang from src/jvm/jvmMain/c/<name>_jni.c
#                              and loaded into jvmTest via java.library.path.
#   project.ffi.napi=true    → N-API C++ Node addon for js/wasmJs targets,
#                              built by the Java N-API builder from src/js/node-<lowername>/dist
#                              and copied into the test runtime's module dir.
#
# project.ffi.name is the CamelCase library identifier that keys task names,
# the .def file, npm package name, and JNI symbol mangling. The lowercase
# form is derived automatically (file names, npm scope, directory names).
# Example for a png port:
#   project.ffi.native=true
#   project.ffi.name=Png
#   → Png.def, png_wrapper.{h,c}, src/js/node-png/dist, @kotlinmania/png-native-bindings
project.ffi.native=false
project.ffi.jvm=false
project.ffi.napi=false
project.ffi.name=Ffi
# Comma-separated source patterns excluded while the corresponding FFI channel is disabled.
project.ffi.napi.kotlinExcludes=io/github/kotlinmania/template/**
project.ffi.jvm.kotlinExcludes=io/github/kotlinmania/template/internal/**
# Optional configured Native target names. Empty keeps all Native targets.
project.ffi.native.targets=
# false permits .def-only bindings to system libraries/frameworks.
project.ffi.native.compileWrapper=true
# Optional paths relative to the jsMain Kotlin source root; excluded only while
# project.ffi.napi=false. Empty preserves the namespace/FFI-name convention.
project.ffi.napi.kotlinSources=

# Comma-separated extra Kotlin compiler arguments for this repo.
project.kotlin.freeCompilerArgs=-Xreturn-value-checker=full

# Comma-separated guest directories preopened for wasmWasiNodeTest (KT-65179).
project.wasmWasi.testPreopens=/tmp,/var/log

# Comma-separated test name patterns skipped in js/wasmJs browser test runs.
project.js.browserTestExcludes=*SmokeFileTest*

# Public signature dependencies only; keep private/platform dependencies in their source sets.
project.dependencies.commonMainApiBundle=

# ============================================================================
# Swift Export & Native Binary Configuration
# ----------------------------------------------------------------------------
# Drives `swiftExport {}`, `binaries.framework {}`, and `binaries.sharedLib {}`
# in build.gradle.kts so one shared build script serves every project.
#
# Kotlin 2.4.x (2.4.21) vs. Kotlin 2.5.0 (`Kotlin/swift-export-sample`) notes:
#   - KGP 2.5.0 replaces `swiftExport {}` with `export { swift { ... } }` and
#     renames `flattenPackage` to `rootPackage` (which maps to
#     `SwiftModuleConfig.ROOT_PACKAGE = "packageRoot"` inside
#     `swift-export-embeddable`). `build.gradle.kts` aliases `rootPackage` to
#     `flattenPackage` on 2.4.21 so `project.swiftExport.rootPackage` works
#     identically across 2.4.x and 2.5.0.
#   - Note on `No name for 'packageRoot' and will be ignored`:
#     KGP 2.4.21 creates a transitive `SwiftExportedModule` with
#     `flattenPackage = null` (`shouldBeFullyExported = false`) for every
#     `commonMain` dependency not explicitly listed in `project.swiftExport.exports`,
#     and `PatchConfigAndLogIssuesKt` logs that warning whenever a module's
#     `rootPackage` is null. Zero-dependency crates should leave
#     `project.dependencies.commonMainBundle=` empty so no unused transitive
#     klib is passed to Swift Export.
#
#   project.swiftExport.moduleName      → defaults to project.frameworkName
#   project.swiftExport.rootPackage     → package collapse rule (defaults to project.namespace;
#                                         alias: project.swiftExport.flattenPackage)
#   project.swiftExport.exports         → comma-separated dependency export specs:
#                                         <catalog-alias|coord|:subproject>|<ModuleName>|<rootPackage>[|<EXPOSED|HIDDEN>]
#                                         (or individual project.swiftExport.export.<key>=... entries)
#   project.swiftExport.exportApiBundle → true automatically exports all libraries in
#                                         project.dependencies.commonMainApiBundle unless HIDDEN
#   project.swiftExport.hidden          → comma-separated dependencies to keep partial/stub-only
#   project.apple.framework.static      → false (default: dynamic Apple frameworks)
#   project.native.sharedLib            → true  (default: emit .dylib/.so/.dll sharedLibs)
# ============================================================================
project.swiftExport.moduleName=
project.swiftExport.rootPackage=
project.swiftExport.flattenPackage=
project.swiftExport.enableCoroutinesSupport=true
project.swiftExport.exportApiBundle=false
project.swiftExport.exports=
project.swiftExport.hidden=
project.swiftExport.freeCompilerArgs=
project.swiftExport.linkTask.freeCompilerArgs=
project.apple.framework.static=false
project.native.sharedLib=true

# Project-specific settings retained during template alignment.
yarn.resolution.minimatch=10.2.5
