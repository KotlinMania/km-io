# true: resolve build dependencies and Gradle plugins from Maven Local first,
# then fall back to the configured remote repositories.
# false: resolve from remote repositories without consulting Maven Local.
maven.local=true

# Shared by dependency resolution and publishToMavenLocal.
# Empty uses <user.home>/.m2/repository; otherwise use an absolute path.
# Use forward slashes in Windows paths, for example C:/Users/name/.m2/repository.
maven.localRepository=
