name: Build (Swift)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform slice"
        required: false
        default: "macosArm64"
        type: choice
        options:
          - all
          - macosArm64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Swift - macosArm64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'macosArm64' }}
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Print Swift / Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build Swift Export package
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        env:
          BUILT_PRODUCTS_DIR: ${{ github.workspace }}/build/swift-test/Debug
          TARGET_BUILD_DIR: ${{ github.workspace }}/build/swift-test/Debug
          SDK_NAME: macosx
          CONFIGURATION: Debug
          ARCHS: arm64
          FRAMEWORKS_FOLDER_PATH: Frameworks
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          DEPLOYMENT_TARGET_SETTING_NAME: MACOSX_DEPLOYMENT_TARGET
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/verification/strict-swift.xcconfig
        run: ./gradlew embedSwiftExportForXcode --no-configuration-cache

      - name: Run Swift Export smoke test against Kotlin-exported module
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: ./gradlew swiftExportSmokeTest --no-configuration-cache

      - name: Upload Swift Export artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-export-artifacts
          path: |
            build/swift-test/Debug/lib*.a
            build/swift-test/Debug/*.swiftmodule/
            build/SPMPackage/macosArm64/Debug/
          retention-days: 7
          if-no-files-found: warn
