  ios:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'ios') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'iosArm64' || inputs.platform == 'iosSimulatorArm64')
    uses: ./.github/workflows/ios.yml
    with:
