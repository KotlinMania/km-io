      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'android-native') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'androidNativeArm64' || inputs.platform == 'androidNativeX64')
    uses: ./.github/workflows/android-native.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  macos:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'macos') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macosArm64')
