name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target family to run (matches src/ hierarchy)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - jvm
          - js
          - wasm
          - android
          - android-native
          - macos
          - ios
          - tvos
          - watchos
          - linux
          - windows
          - swift
      platform:
        description: "Platform runner / architecture slice (e.g. macosArm64 for jvm)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macosArm64
          - iosArm64
          - iosSimulatorArm64
          - tvosArm64
          - tvosSimulatorArm64
          - watchosDeviceArm64
          - watchosSimulatorArm64
          - androidNativeArm64
          - androidNativeX64
          - linuxX64
          - linuxArm64
          - mingwX64
      phase:
        description: "Execution phase (build, test, or both)"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  jvm:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'jvm') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macosArm64' || inputs.platform == 'linuxX64' || inputs.platform == 'linuxArm64' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/jvm.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  js:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'js') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macosArm64' || inputs.platform == 'linuxX64' || inputs.platform == 'linuxArm64' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/js.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  wasm:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'wasm') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macosArm64' || inputs.platform == 'linuxX64' || inputs.platform == 'linuxArm64' || inputs.platform == 'mingwX64')
    uses: ./.github/workflows/wasm.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  android:
    if: >-
      (inputs.target == '' || inputs.target == 'all' || inputs.target == 'android') &&
      (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macosArm64' || inputs.platform == 'linuxX64')
    uses: ./.github/workflows/android.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      phase: ${{ inputs.phase || 'build-and-test' }}
    permissions:
      contents: read

  android-native:
