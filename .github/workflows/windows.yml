name: Build (Windows)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Windows native target slice"
        required: false
        default: "mingwX64"
        type: choice
        options:
          - all
          - mingwX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Windows - mingwX64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'mingwX64' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Build Windows target and C wrapper (mingwX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          compileKotlinMingwX64
          mingwX64TestBinaries
          --no-configuration-cache

      - name: Test Windows target (mingwX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: >
          ./gradlew
          mingwX64Test
          --no-configuration-cache

      - name: Upload test reports (Windows)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
