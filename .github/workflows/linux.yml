name: Build (Linux)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Linux native target slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linuxX64
          - linuxArm64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  linuxX64:
    name: Build and Test (Linux - linuxX64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'linuxX64' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Linux target and C wrapper (linuxX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: ./gradlew compileKotlinLinuxX64 linuxX64TestBinaries --no-configuration-cache
      - name: Test Linux target (linuxX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: ./gradlew linuxX64Test --no-configuration-cache
      - name: Upload test reports (Linux - linuxX64)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-linuxX64
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn

  linuxArm64:
    name: Build and Test (Linux - linuxArm64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'linuxArm64' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Linux target and C wrapper (linuxArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: ./gradlew compileKotlinLinuxArm64 linuxArm64TestBinaries --no-configuration-cache
      - name: Test Linux target (linuxArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: ./gradlew linuxArm64Test --no-configuration-cache
      - name: Upload test reports (Linux - linuxArm64)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-linuxArm64
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
