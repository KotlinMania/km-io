name: Build (Linux)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Linux native target slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linuxX64
          - linuxArm64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Linux - ${{ matrix.platform }})
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linuxX64
            runner: ubuntu-latest
            compileTask: compileKotlinLinuxX64
            testBinariesTask: linuxX64TestBinaries
            testTask: linuxX64Test
          - platform: linuxArm64
            runner: ubuntu-24.04-arm
            compileTask: compileKotlinLinuxArm64
            testBinariesTask: linuxArm64TestBinaries
            testTask: linuxArm64Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build Linux target and C wrapper (${{ matrix.platform }})
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          ${{ matrix.compileTask }}
          ${{ matrix.testBinariesTask }}
          --no-configuration-cache

      - name: Test Linux target (${{ matrix.platform }})
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: >
          ./gradlew
          ${{ matrix.testTask }}
          --no-configuration-cache

      - name: Upload test reports (Linux - ${{ matrix.platform }})
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-${{ matrix.platform }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
