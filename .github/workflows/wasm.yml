name: Build (WASM)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Host platform runner for WASM + N-API / WASI C bindings"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macosArm64
          - linuxX64
          - linuxArm64
          - mingwX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  macosArm64:
    name: Build and Test (WASM - macosArm64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'macosArm64' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Set up Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Build WASM targets and N-API / WASI bindings (macosArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        shell: bash
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
        run: >
          ./gradlew
          compileDevelopmentLibraryKotlinWasmJs
          compileProductionLibraryKotlinWasmJs
          wasmJsMainClasses
          wasmJsTestClasses
          compileDevelopmentLibraryKotlinWasmWasi
          compileProductionLibraryKotlinWasmWasi
          wasmWasiMainClasses
          wasmWasiTestClasses
          --no-configuration-cache
      - name: Test WASM targets and N-API / WASI bindings (macosArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        shell: bash
        env:
          ORG_GRADLE_PROJECT_kotlin_js_yarn_download: "false"
        run: ./gradlew wasmJsNodeTest wasmWasiNodeTest wasmJsBrowserTest --no-configuration-cache
      - name: Upload test reports (WASM - macosArm64)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-wasm-macosArm64
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn

  linuxX64:
    name: Build and Test (WASM - linuxX64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'linuxX64' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
