name: Build (iOS)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "iOS target slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - iosArm64
          - iosSimulatorArm64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (iOS)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'iosArm64' || inputs.platform == 'iosSimulatorArm64' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build iOS targets + XCFramework
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: |
          XCF_NAME=$(grep -E '^project\.frameworkName=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$XCF_NAME" ]; then
            echo "::error::project.frameworkName is not set in gradle.properties"
            exit 1
          fi
          ./gradlew \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            iosSimulatorArm64TestBinaries \
            "assemble${XCF_NAME}XCFramework" \
            --no-configuration-cache

      - name: Test iOS simulator target (iosSimulatorArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' && ((inputs.platform || 'all') == 'all' || inputs.platform == 'iosSimulatorArm64') }}
        run: >
          ./gradlew
          iosSimulatorArm64Test
          --no-configuration-cache

      - name: Upload test reports (iOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
