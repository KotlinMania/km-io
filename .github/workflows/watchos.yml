name: Build (watchOS)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "watchOS target slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - watchosDeviceArm64
          - watchosSimulatorArm64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (watchOS)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'watchosDeviceArm64' || inputs.platform == 'watchosSimulatorArm64' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build watchOS targets and C wrappers
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          compileKotlinWatchosDeviceArm64
          compileKotlinWatchosSimulatorArm64
          watchosSimulatorArm64TestBinaries
          --no-configuration-cache

      - name: Test watchOS simulator target (watchosSimulatorArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' && ((inputs.platform || 'all') == 'all' || inputs.platform == 'watchosSimulatorArm64') }}
        run: >
          ./gradlew
          watchosSimulatorArm64Test
          --no-configuration-cache

      - name: Upload test reports (watchOS)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-watchos
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
