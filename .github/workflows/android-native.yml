name: Build (Android Native)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Android Native 64-bit slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - androidNativeArm64
          - androidNativeX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build (Android Native - ${{ matrix.platform }})
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: androidNativeArm64
            compileTask: compileKotlinAndroidNativeArm64
            testBinariesTask: androidNativeArm64TestBinaries
          - platform: androidNativeX64
            compileTask: compileKotlinAndroidNativeX64
            testBinariesTask: androidNativeX64TestBinaries
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build Android Native target and C wrapper (${{ matrix.platform }})
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          ${{ matrix.compileTask }}
          ${{ matrix.testBinariesTask }}
          --no-configuration-cache
