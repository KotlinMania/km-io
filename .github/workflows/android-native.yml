name: Build (Android Native)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Android Native 64-bit slice"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - androidNativeArm64
          - androidNativeX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  androidNativeArm64:
    name: Build (Android Native - androidNativeArm64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'androidNativeArm64' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Android Native target and C wrapper (androidNativeArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: ./gradlew compileKotlinAndroidNativeArm64 androidNativeArm64TestBinaries --no-configuration-cache

  androidNativeX64:
    name: Build (Android Native - androidNativeX64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'androidNativeX64' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Android Native target and C wrapper (androidNativeX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: ./gradlew compileKotlinAndroidNativeX64 androidNativeX64TestBinaries --no-configuration-cache
