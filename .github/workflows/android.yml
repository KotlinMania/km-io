name: Build (Android)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Host runner for Android JVM + JNI + Emulator tests"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macosArm64
          - linuxX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android - ${{ matrix.platform }})
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linuxX64
            runner: ubuntu-latest
          - platform: macosArm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build Android targets and JNI bindings (${{ matrix.platform }})
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          compileAndroidMain
          compileAndroidHostTest
          compileAndroidDeviceTest
          assembleAndroidMain
          assembleAndroidHostTest
          assembleAndroidDeviceTest
          assembleUnitTest
          assembleAndroidTest
          --no-configuration-cache

      - name: Test Android host and emulator device targets (${{ matrix.platform }})
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          testAndroidHostTest
          verifyAndroidDeviceTestResults
          --no-configuration-cache

      - name: Upload test reports (Android - ${{ matrix.platform }})
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android-${{ matrix.platform }}
          path: |
            build/reports/tests/
            build/test-results/
            build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
