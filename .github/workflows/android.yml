name: Build (Android)

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: "all"
      phase:
        type: string
        required: false
        default: "build-and-test"
  workflow_dispatch:
    inputs:
      platform:
        description: "Host runner for Android JVM + JNI + Emulator tests"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macosArm64
          - linuxX64
      phase:
        description: "Execution phase"
        required: false
        default: "build-and-test"
        type: choice
        options:
          - build-and-test
          - build-only
          - test-only

permissions:
  contents: read

jobs:
  linuxX64:
    name: Build and Test (Android - linuxX64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'linuxX64' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Android targets and JNI bindings (linuxX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          compileAndroidMain
          compileAndroidHostTest
          compileAndroidDeviceTest
          assembleAndroidMain
          assembleAndroidHostTest
          assembleAndroidDeviceTest
          assembleUnitTest
          assembleAndroidTest
          --no-configuration-cache
      - name: Test Android host and emulator device targets (linuxX64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          testAndroidHostTest
          verifyAndroidDeviceTestResults
          --no-configuration-cache
      - name: Upload test reports (Android - linuxX64)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android-linuxX64
          path: |
            build/reports/tests/
            build/test-results/
            build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn

  macosArm64:
    name: Build and Test (Android - macosArm64)
    if: ${{ (inputs.platform || 'all') == 'all' || inputs.platform == 'macosArm64' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build Android targets and JNI bindings (macosArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'test-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          compileAndroidMain
          compileAndroidHostTest
          compileAndroidDeviceTest
          assembleAndroidMain
          assembleAndroidHostTest
          assembleAndroidDeviceTest
          assembleUnitTest
          assembleAndroidTest
          --no-configuration-cache
      - name: Test Android host and JNI bindings (macosArm64)
        if: ${{ (inputs.phase || 'build-and-test') != 'build-only' }}
        run: >
          ./gradlew
          setupAndroidSdk
          testAndroidHostTest
          --no-configuration-cache
      - name: Upload test reports (Android - macosArm64)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android-macosArm64
          path: |
            build/reports/tests/
            build/test-results/
            build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
